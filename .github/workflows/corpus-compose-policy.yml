name: corpus compose policy (F30)
on:
  pull_request:
    paths:
      - "corpus_service/**"
      - "ci_gates/check_compose_policy.py"
      - "ci_gates/test_check_compose_policy.py"
      - "ci_gates/fixtures/**"
      - ".github/workflows/corpus-compose-policy.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install pyyaml==6.0.3
      - name: Policy unit tests (shipped compose passes; every fixture trips exactly its declared rules)
        run: python3 ci_gates/test_check_compose_policy.py -v
      - name: Policy accepts the shipped compose
        run: python3 ci_gates/check_compose_policy.py corpus_service/docker-compose.yml
      - name: Policy rejects the insecure fixtures, each for its own reason
        run: |
          set -u
          status=0
          for f in ci_gates/fixtures/compose_*.yml; do
            if out=$(python3 ci_gates/check_compose_policy.py "$f"); then
              echo "::error::policy accepted insecure fixture $f"; status=1; continue
            fi
            expected=$(sed -n 's/^# expect: //p' "$f" | tr ',' '\n' | tr -d ' ')
            fired=$(printf '%s\n' "$out" | sed -n 's/^FAIL [^ ]*: \[\([a-z-]*\)\] .*/\1/p' | sort -u)
            if [ "$(printf '%s\n' "$expected" | sort -u)" != "$fired" ]; then
              echo "::error::$f expected rules [$(echo $expected)] but got [$(echo $fired)]"; status=1
            else
              echo "OK $f rejected for: $(echo $fired)"
            fi
          done
          exit $status
      - name: Compose refuses to start without each required secret
        working-directory: corpus_service
        run: |
          set -u
          touch .env
          vars="POSTGRES_USER POSTGRES_PASSWORD APP_DB_USER APP_DB_PASSWORD MIGRATE_DB_USER MIGRATE_DB_PASSWORD REDIS_APP_USER REDIS_APP_PASSWORD"
          for v in $vars; do export "$v=$(openssl rand -hex 12)"; done
          docker compose config >/dev/null
          for missing in $vars; do
            if env -u "$missing" docker compose config >/dev/null 2>&1; then
              echo "::error::compose accepted a missing $missing"; exit 1
            fi
          done
          echo "OK: compose refuses to start without any one of: $vars"
      - name: E2E - store TLS, Redis ACLs, least-privilege roles (real stores + the app's own code path)
        run: bash corpus_service/tests/e2e/store_security_e2e.sh
      - name: E2E - upgrade a pre-F30 legal/legal volume in place (TLS on, credentials rotated, roles provisioned, data kept)
        run: bash corpus_service/tests/e2e/upgrade_e2e.sh
