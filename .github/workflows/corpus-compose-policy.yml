name: corpus compose policy (F30)
# Cost: a draft PR does not run this job; marking it ready for review does (when these paths changed). A PR converted
# to draft starts a run whose job skips, and that run cancels the one in flight (concurrency below).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "corpus_service/**"
      - "ci_gates/check_compose_policy.py"
      - "ci_gates/test_check_compose_policy.py"
      - "ci_gates/fixtures/**"
      - ".github/workflows/corpus-compose-policy.yml"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer event on a PR (a push, or conversion to draft) supersedes the older run; pushes to main run to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install pyyaml==6.0.3
      # The policy checks each deployment as `docker compose config` resolves it (overrides,
      # include, extends, profiles, interpolation), plus the raw files for credential forms.
      - name: Policy unit tests (shipped compose passes; every fixture trips exactly its declared rules)
        run: python3 ci_gates/test_check_compose_policy.py -v
      - name: Policy accepts the shipped compose (merged with any override file next to it)
        run: python3 ci_gates/check_compose_policy.py corpus_service/docker-compose.yml
      - name: Policy rejects the insecure fixtures, each for its own reason
        run: |
          set -u
          status=0
          for f in ci_gates/fixtures/compose_*.yml ci_gates/fixtures/case_*/docker-compose.yml; do
            if out=$(python3 ci_gates/check_compose_policy.py "$f"); then
              echo "::error::policy accepted insecure fixture $f"; status=1; continue
            fi
            expected=$(sed -n 's/^# expect: //p' "$f" | tr ',' '\n' | tr -d ' ')
            fired=$(printf '%s\n' "$out" | sed -n 's/^FAIL [^ ]*: \[\([a-z-]*\)\] .*/\1/p' | sort -u)
            if [ "$(printf '%s\n' "$expected" | sort -u)" != "$fired" ]; then
              echo "::error::$f expected rules [$(echo $expected)] but got [$(echo $fired)]"; status=1
            else
              echo "OK $f rejected for: $(echo $fired)"
            fi
          done
          exit $status
      - name: Compose refuses to start without each required secret
        working-directory: corpus_service
        run: |
          set -u
          # Variables referenced as ${VAR:?} fail `docker compose config`; POSTGRES_PASSWORD is used
          # only as a secret file (secrets: environment:), which compose refuses when the service
          # starts, so each case also tries to start the no-network secrets-preflight one-shot.
          vars="POSTGRES_USER POSTGRES_PASSWORD APP_DB_USER APP_DB_PASSWORD MIGRATE_DB_USER MIGRATE_DB_PASSWORD REDIS_APP_USER REDIS_APP_PASSWORD ENCRYPTION_KEY ADMIN_API_KEY SECRET_KEY"
          for v in $vars; do export "$v=$(openssl rand -hex 24)"; done
          export POSTGRES_USER=boot_ci APP_DB_USER=corpus_app MIGRATE_DB_USER=corpus_migrate REDIS_APP_USER=corpus_redis
          docker compose config >/dev/null
          docker compose run --rm -T --no-deps secrets-preflight
          for missing in $vars; do
            if out=$( { env -u "$missing" docker compose config >/dev/null \
                        && env -u "$missing" docker compose run --rm -T --no-deps secrets-preflight; } 2>&1 ); then
              echo "::error::compose accepted a missing $missing"; exit 1
            fi
            # The refusal must name the missing variable (not fail for some other reason).
            printf '%s' "$out" | grep -q -- "$missing" || { echo "::error::refused without naming $missing: $out"; exit 1; }
          done
          docker compose down --remove-orphans >/dev/null 2>&1 || true
          echo "OK: compose refuses to start without any one of: $vars"
      - name: E2E - store TLS, Redis ACLs, least-privilege roles, per-service credentials (real stores + the app's own code path)
        run: bash corpus_service/tests/e2e/store_security_e2e.sh
      - name: E2E - upgrade a pre-F30 legal/legal volume in place (TLS on, credentials rotated, roles provisioned, data kept)
        run: bash corpus_service/tests/e2e/upgrade_e2e.sh
