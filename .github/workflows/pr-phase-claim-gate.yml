name: PR phase-claim gate

# Runs on drafts too (about a minute, and it checks the PR body). A newer edit or push supersedes the older run.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: claim-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claim-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate PR phase claims
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ci_gates/check_pr_phase_claims.py
