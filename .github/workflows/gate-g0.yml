name: Gate G-0

on:
  pull_request:
  push:
    branches: [main, correction-pack-10sep2026]

jobs:
  g0-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the product + phase-audit-doc guard (G-0 [15]) diffs against the PR base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          # functions/ declares engines.node 22 and deploys on 22; the whole job runs on it.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Gate G-0 static
        env:
          # pull_request: the PR's base commit; push: origin/main (present because fetch-depth is 0).
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash ci_gates/gate_g0.sh
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:all
      - name: Gate G-1 forensic
        run: python3 ci_gates/gate_g1.py
      # Cloud Functions (functions/): own lockfile, typecheck, bundle, emulator suites.
      # The rules suite (npm run test:rules) already runs inside "Unit tests" (test:all).
      - name: Functions install
        run: npm --prefix functions ci
      - name: Functions typecheck
        run: npm --prefix functions run typecheck
      - name: Functions build
        run: npm --prefix functions run build
      # test/g2.cross-firm.test.ts is excluded here (functions/vitest.config.ts): it runs once, in gate:g2.
      - name: Functions tests (Auth + Firestore emulators)
        run: npm --prefix functions run test:emu
      - name: Gate G-2 cross-firm isolation (L18 §10)
        run: npm run gate:g2
