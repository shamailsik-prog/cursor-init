name: Gate G-0

on:
  pull_request:
  push:
    branches: [main, correction-pack-10sep2026]

jobs:
  g0-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Gate G-0 static
        run: bash ci_gates/gate_g0.sh
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:all
      - name: Gate G-1 forensic
        run: python3 ci_gates/gate_g1.py
