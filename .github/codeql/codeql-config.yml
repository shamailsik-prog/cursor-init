name: cursor-init CodeQL config
# Generated, vendored and test-fixture trees: not product code.
paths-ignore:
  - node_modules
  - functions/node_modules
  - functions/lib
  - .next
  - reports
  - .stryker-tmp
  - artifacts
  # F41 / E-24 quarantine (LEGACY_GOVERNANCE_CHAINS off): frozen governance monoliths
  # and adapters are not active product surface; keep CodeQL focused on live routes.
  - app/api/d2/ops-reporting
  - app/api/d4/filings
  - app/ops/operator-audit-console.tsx
  - platform/persistence/workflowOps*Governance.ts
  # One adapter filename alone exceeds CodeQL's 255-byte trap path limit and aborts JS extraction.
  - platform/persistence/workflowOpsAlertArchivalExportCustodyHandoffExternalTransportReceiptAcknowledgmentClosureAttestationExternalTransportReceiptAcknowledgmentReconciliationExternalDistributionAuditLedgerPartnerHandoffAttestationOutboundRegistryAttestationLedgerGovernance.ts
