# Secure baseline using compose secret FILES for the store passwords (re-audit D5): must PASS.
# Same as baseline_secure.yml except that postgres reads POSTGRES_PASSWORD_FILE / *_PASSWORD_FILE
# from /run/secrets, backed by top-level secrets with an environment: source (compose refuses to
# start the service while that variable is unset).
services:
  app:
    build: .
    environment:
      DATABASE_URL: "postgresql+asyncpg://${APP_DB_USER:?x}:${APP_DB_PASSWORD:?x}@postgres:5432/legal_scraper?sslmode=verify-full&sslrootcert=/run/tls-ca/ca.crt"
      REDIS_URL: "rediss://${REDIS_APP_USER:?x}:${REDIS_APP_PASSWORD:?x}@redis:6379/0"
    networks: [edge, data]
  postgres:
    image: pgvector/pgvector:pg16
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/tls/server.crt, -c, ssl_key_file=/run/tls/server.key,
              -c, password_encryption=scram-sha-256, -c, hba_file=/etc/postgresql/corpus/pg_hba.conf]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?x}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DB_USER: ${APP_DB_USER:?x}
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets: [postgres_password, app_db_password]
    volumes: ["./pg_hba_secure.conf:/etc/postgresql/corpus/pg_hba.conf:ro"]
    networks: [data]
  redis:
    image: redis:7-alpine
    command: [redis-server, --port, "0", --tls-port, "6379", --tls-cert-file, /run/tls/server.crt,
              --tls-key-file, /run/tls/server.key, --user, default, "off", resetpass, "-@all",
              --user, "${REDIS_APP_USER:?x}", "on", ">${REDIS_APP_PASSWORD:?x}", "~*", "&*", "+@all", "-@admin", "-@dangerous"]
    networks: [data]
networks:
  edge: {}
  data: {internal: true}
secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  app_db_password:
    environment: APP_DB_PASSWORD
