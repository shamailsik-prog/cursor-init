# Corpus Postgres client authentication (audit F30). Loaded via `-c hba_file=` so it applies to
# fresh AND pre-existing data volumes (the image's own $PGDATA/pg_hba.conf is ignored).
# Checked by ci_gates/check_compose_policy.py; proven end to end in
# .github/workflows/corpus-compose-policy.yml.
#
# TYPE     DATABASE        USER             ADDRESS   METHOD

# Unix socket inside the postgres container only: the image's init scripts, pg_isready and
# `docker compose exec -u postgres postgres psql ...` maintenance (rotation/upgrade script).
# Only the container's own OS user "postgres" is accepted (peer), mapped in pg_ident.conf.
local      all             all                        peer map=container_admin

# Never accept a TCP connection that is not TLS.
hostnossl  all             all              all       reject

# TLS + SCRAM, only to the corpus database, only for the application roles (members of the
# NOLOGIN group corpus_clients, created by provision-roles.sh). The bootstrap superuser
# (POSTGRES_USER) therefore cannot log in over the network at all.
hostssl    legal_scraper   +corpus_clients  all       scram-sha-256

# Everything else over TCP (superuser, other databases, replication) is refused.
hostssl    all             all              all       reject
hostssl    replication     all              all       reject
