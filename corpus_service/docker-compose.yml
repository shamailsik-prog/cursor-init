# Production-safe compose (audit F30).
# - Data stores are NOT published on host interfaces and sit on an internal-only network.
# - Every credential is required and has no default. Put them in corpus_service/.env: compose
#   reads that file ONLY to interpolate the ${VAR} references below. It is never handed to a
#   container (no service uses `env_file: .env`), so each container receives only the credentials
#   it uses:
#     api, worker-embed, celery-beat  runtime DB role (APP_DB_*) + Redis ACL user, inside their URLs
#     migrate                         migration (schema-owner) role only, no Redis
#     postgres                        what role provisioning needs, as secret FILES (/run/secrets)
#     redis                           its own ACL user; secrets-preflight: the passwords, as files
#   Non-secret application settings live in the committed app.env.
# - Both stores speak TLS only, with certificates from a private CA issued by the one-shot `certs`
#   service (or supplied by the operator, see README). Clients verify the server certificate and
#   hostname.
# - Postgres: TLS + SCRAM only for the application roles; the bootstrap superuser cannot log in over
#   the network. The app runs as a DML-only role; schema DDL runs once as the migration role.
# - Redis: TLS only (plaintext port disabled), the `default` user is disabled, and the app uses an
#   ACL user without @admin/@dangerous commands.
# Policy: ci_gates/check_compose_policy.py checks this file merged with any override, as
# `docker compose config` resolves it. Proven end to end in .github/workflows/corpus-compose-policy.yml.

# Application (not store) secrets. Settings fails closed in production without them, in every
# process that loads it.
x-app-secrets: &app-secrets
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY_required}
  ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY_required}
  CORPUS_ADMIN_CREDENTIALS: ${CORPUS_ADMIN_CREDENTIALS:?CORPUS_ADMIN_CREDENTIALS_required}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY_required}

# Runtime services: the DML-only database role and the Redis ACL user, nothing else.
x-runtime-env: &runtime-env
  <<: *app-secrets
  DATABASE_URL: "postgresql+asyncpg://${APP_DB_USER:?APP_DB_USER_required}:${APP_DB_PASSWORD:?APP_DB_PASSWORD_required}@postgres:5432/legal_scraper?sslmode=verify-full&sslrootcert=/run/tls-ca/ca.crt"
  REDIS_URL: "rediss://${REDIS_APP_USER:?REDIS_APP_USER_required}:${REDIS_APP_PASSWORD:?REDIS_APP_PASSWORD_required}@redis:6379/0"
  REDIS_TLS_CA_FILE: /run/tls-ca/ca.crt

x-runtime-depends: &runtime-depends
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  api:
    build: .
    ports:
      # Bind to loopback by default; put a TLS reverse proxy in front. Override API_BIND only deliberately.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    env_file: app.env
    environment:
      <<: *runtime-env
    volumes:
      - ./live:/app/live
      - ./blackletter_state:/app/state
      - tls-ca:/run/tls-ca:ro
    networks: [edge, data]
    depends_on: *runtime-depends
    command: uvicorn scraper.main:app --host 0.0.0.0 --port 8000

  worker-embed:
    build: .
    env_file: app.env
    environment:
      <<: *runtime-env
      # FA-D3C-002: embeddings go through the P1 gateway (Cloud Functions p1CorpusEmbedding); this service holds no
      # provider key. Empty disables embeddings. Enabling them also needs the corpus service account's OIDC ID token
      # at /run/secrets/p1_id_token (the default P1_ID_TOKEN_FILE): add the compose secret p1_id_token to this service
      # in docker-compose.override.yml (README, "Embeddings through P1").
      P1_EMBEDDING_URL: ${P1_EMBEDDING_URL:-}
    volumes:
      - ./live:/app/live
      - ./blackletter_state:/app/state
      - tls-ca:/run/tls-ca:ro
    networks: [edge, data]
    depends_on: *runtime-depends
    command: celery -A scraper.tasks.celery_app worker -Q celery,embeddings --loglevel=INFO
    restart: unless-stopped

  # Beat imports the task modules (and so scraper.database) to register the schedule; it gets the
  # runtime role, never the migration or bootstrap credentials.
  celery-beat:
    build: .
    env_file: app.env
    environment:
      <<: *runtime-env
    volumes:
      - tls-ca:/run/tls-ca:ro
    networks: [data]
    depends_on: *runtime-depends
    command: celery -A scraper.tasks.celery_app beat --loglevel=INFO
    restart: unless-stopped

  # One-shot schema migration: Base.metadata.create_all + seed, as the schema-owner role. The
  # runtime role has no DDL rights, so api/workers start only after this completes. No Redis.
  migrate:
    build: .
    env_file: app.env
    environment:
      <<: *app-secrets
      DATABASE_URL: "postgresql+asyncpg://${MIGRATE_DB_USER:?MIGRATE_DB_USER_required}:${MIGRATE_DB_PASSWORD:?MIGRATE_DB_PASSWORD_required}@postgres:5432/legal_scraper?sslmode=verify-full&sslrootcert=/run/tls-ca/ca.crt"
      REDIS_URL: ""
    volumes:
      - tls-ca:/run/tls-ca:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m scraper.migrate
    restart: "no"

  # One-shot, no network: refuses to let the stores start unless every store password is at
  # least 16 URL-safe characters, not a known default, and all four differ (audit F30).
  secrets-preflight:
    image: pgvector/pgvector:pg16@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
    entrypoint: ["/bin/bash", "/usr/local/bin/check-secrets.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER_required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER_required}
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:?MIGRATE_DB_USER_required}
      REDIS_APP_USER: ${REDIS_APP_USER:?REDIS_APP_USER_required}
    secrets: [postgres_password, app_db_password, migrate_db_password, redis_app_password]
    volumes:
      - ./docker/preflight/check-secrets.sh:/usr/local/bin/check-secrets.sh:ro
    tmpfs:
      - /var/lib/postgresql/data
    network_mode: none
    restart: "no"

  # One-shot: issue (or validate operator-supplied) TLS material for the stores. Same pinned image
  # as Postgres (it ships openssl), no network.
  certs:
    image: pgvector/pgvector:pg16@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
    entrypoint: ["/bin/sh", "/usr/local/bin/generate-certs.sh"]
    environment:
      TLS_CERTS_MODE: ${TLS_CERTS_MODE:-auto}
    volumes:
      - ./docker/certs/generate-certs.sh:/usr/local/bin/generate-certs.sh:ro
      - tls-ca:/tls/ca
      - tls-postgres:/tls/postgres
      - tls-redis:/tls/redis
    # The image declares VOLUME /var/lib/postgresql/data; give this one-shot a tmpfs there so it
    # leaves no anonymous volume behind.
    tmpfs:
      - /var/lib/postgresql/data
    network_mode: none
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/tls/server.crt
      - -c
      - ssl_key_file=/run/tls/server.key
      - -c
      - ssl_ca_file=/run/tls-ca/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/corpus/pg_hba.conf
      - -c
      - ident_file=/etc/postgresql/corpus/pg_ident.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER_required}
      POSTGRES_DB: legal_scraper
      # Passwords arrive as files (compose secrets), not as environment values. The image reads
      # POSTGRES_PASSWORD_FILE; docker/postgres/provision-roles.sh reads the other two.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER_required}
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:?MIGRATE_DB_USER_required}
      MIGRATE_DB_PASSWORD_FILE: /run/secrets/migrate_db_password
    secrets: [postgres_password, app_db_password, migrate_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./docker/postgres/provision-roles.sh:/docker-entrypoint-initdb.d/20-provision-roles.sh:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/corpus/pg_hba.conf:ro
      - ./docker/postgres/pg_ident.conf:/etc/postgresql/corpus/pg_ident.conf:ro
      - tls-postgres:/run/tls:ro
      - tls-ca:/run/tls-ca:ro
      # Annex A corpus contract (audit F19): postgres/ddl 001 + 003, applied by the superuser at init,
      # between 10-init.sql and 20-provision-roles.sh (and by scripts/rotate_postgres_password.sh on an
      # existing volume).
      - ../postgres/ddl:/etc/postgresql/corpus/ddl:ro
      - ./docker/postgres/apply-annex-a.sh:/docker-entrypoint-initdb.d/15-apply-annex-a.sh:ro
    networks: [data]
    depends_on:
      secrets-preflight:
        condition: service_completed_successfully
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "gosu postgres pg_isready -U \"$${POSTGRES_USER}\" -d legal_scraper"]
      interval: 5s
      retries: 10
    # No "ports:" on purpose: reachable only from the internal data network.

  redis:
    image: redis:7-alpine@sha256:1cf73a2f04808e55a8bd2f5706c2aa0ebb0f71938f93deb7af79f48311cd5cb9
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/tls/server.crt
      - --tls-key-file
      - /run/tls/server.key
      - --tls-ca-cert-file
      - /run/tls-ca/ca.crt
      # Server-authenticated TLS; clients authenticate with their ACL user + password.
      - --tls-auth-clients
      - "no"
      - --protected-mode
      - "yes"
      # The built-in `default` user is disabled and has no password, keys, channels or commands.
      - --user
      - default
      - "off"
      - resetpass
      - resetkeys
      - resetchannels
      - "-@all"
      # Application ACL user (Celery broker + result backend): no @admin, no @dangerous, no
      # Lua/function flushing, no switching to another logical database.
      - --user
      - "${REDIS_APP_USER:?REDIS_APP_USER_required}"
      - "on"
      - ">${REDIS_APP_PASSWORD:?REDIS_APP_PASSWORD_required}"
      - "~*"
      - "&*"
      - "+@all"
      - "-@admin"
      - "-@dangerous"
      - "-select"
      - "-script|flush"
      - "-function"
    environment:
      REDIS_APP_USER: ${REDIS_APP_USER:?REDIS_APP_USER_required}
    secrets: [redis_app_password]
    volumes:
      - tls-redis:/run/tls:ro
      - tls-ca:/run/tls-ca:ro
    networks: [data]
    depends_on:
      secrets-preflight:
        condition: service_completed_successfully
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_app_password)\" redis-cli --tls --cacert /run/tls-ca/ca.crt -h redis -p 6379 --user \"$$REDIS_APP_USER\" ping | grep -qx PONG"]
      interval: 5s
      retries: 10
    # No "ports:" on purpose.

networks:
  edge: {}
  data:
    internal: true

volumes:
  pgdata:
  tls-ca:
  tls-postgres:
  tls-redis:

# Store passwords delivered to the store containers as files under /run/secrets. Compose refuses
# to start a service that uses one of these while its variable is unset.
secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  app_db_password:
    environment: APP_DB_PASSWORD
  migrate_db_password:
    environment: MIGRATE_DB_PASSWORD
  redis_app_password:
    environment: REDIS_APP_PASSWORD
