# Audit F30 e2e overlay, used only by tests/e2e/*.sh:
#   docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml ...
# It swaps the app image for tests/e2e/Dockerfile (same code, same pinned DB/broker clients) and
# supplies throwaway production secrets. It does NOT touch DATABASE_URL, REDIS_URL, the CA mount,
# networks, or any store service: those come from docker-compose.yml exactly as shipped.
x-e2e-app: &e2e-app
  build:
    context: .
    dockerfile: tests/e2e/Dockerfile
  image: ${E2E_IMAGE:-corpus-f30-e2e:local}
  environment:
    ENVIRONMENT: production
    ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?set by the e2e script}
    ADMIN_API_KEY: ${E2E_ADMIN_API_KEY:?set by the e2e script}
    SECRET_KEY: ${E2E_SECRET_KEY:?set by the e2e script}
    E2E_BOOTSTRAP_USER: ${POSTGRES_USER:?set by the e2e script}

services:
  migrate: *e2e-app
  api: *e2e-app
  worker-embed: *e2e-app
