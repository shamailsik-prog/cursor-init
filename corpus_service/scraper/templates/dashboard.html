<!DOCTYPE html><html><head><meta charset="utf-8"><title>Corpus Service</title><style>body{font-family:system-ui;background:#0f0f0f;color:#e0e0e0;padding:20px}.card{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:16px;margin:12px 0}button{padding:8px 16px;border-radius:6px;border:none;cursor:pointer}.start{background:#2a7a2a;color:white}.stop{background:#7a2a2a;color:white}.feed{font-family:monospace;font-size:12px;max-height:300px;overflow-y:auto;background:#111;padding:8px}</style></head><body><header><h2>Corpus Service · FINAL_2</h2><button class="start" onclick="api('/api/start',{method:'POST'}).catch(()=>{})">Start</button><button class="stop" onclick="if(confirm('Stop?'))api('/api/stop',{method:'POST'}).catch(()=>{})">Stop</button><button onclick="unlock()">Enter key</button></header><div class="card"><h3>Metrics</h3><div>Unique PDFs: <b id="pdfs">-</b></div><div>Seen: <b id="seen">-</b></div></div><div class="card"><h3>Live Feed</h3><div id="feed" class="feed"></div></div><script>
// The admin key is never embedded server-side: prompt once per tab and keep it in sessionStorage.
// A rejected or cancelled key pauses authenticated polling until the user clicks "Enter key".
let paused=false;
function locked(){paused=true;sessionStorage.removeItem('k');document.getElementById('feed').innerText='Admin key missing or rejected. Click "Enter key".';}
function adminKey(){let k=sessionStorage.getItem('k');if(!k&&!paused){k=prompt('Admin API key')||'';if(k)sessionStorage.setItem('k',k);}return k||'';}
function api(p,o={}){const k=adminKey();if(!k){locked();return Promise.reject(new Error('no admin key'));}return fetch(p,{...o,headers:{...(o.headers||{}),'X-API-Key':k}}).then(r=>{if(r.status===401){locked();throw new Error('unauthorised');}return r;});}
function unlock(){sessionStorage.removeItem('k');paused=false;r();}
async function r(){try{let h=await fetch('/health').then(x=>x.json());document.getElementById('pdfs').innerText=h.total_pdfs;document.getElementById('seen').innerText=h.seen;if(paused)return;let f=await api('/api/live-feed').then(x=>x.json());document.getElementById('feed').innerText=f.feed.join('\n');}catch(e){}}
setInterval(r,5000);r();</script></body></html>
