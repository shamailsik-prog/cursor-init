# gitleaks configuration (.github/workflows/security.yml "Secret scan").
# The default ruleset applies in full; the allowlists below only drop known,
# non-secret test fixtures. Every entry is narrowed by path AND by the shape of
# the matched value, so a real key in the same file is still reported.
# Baseline (full history, 2026-10-06, gitleaks 8.30.1): every finding was one
# of these fixtures; see docs/audits/README.md "Secret scanning".

title = "cursor-init gitleaks config"

[extend]
useDefault = true

# Idempotency keys in tests are random UUIDs passed as `key = "..."`,
# `idempotencyKey: "..."` or an `Idempotency-Key` header; generic-api-key
# matches them by keyword. A UUID is not a credential format.
[[allowlists]]
description = "UUID idempotency keys in test files"
condition = "AND"
regexTarget = "secret"
regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']
paths = ['''^tests/.+\.test\.ts$''', '''^functions/test/.+\.ts$''']

# .env.example is a template whose values are deliberately empty; the generic
# rule captures the next line's variable name (`ENCRYPTION_KEY=`) as the value.
[[allowlists]]
description = "empty placeholders in .env.example templates"
condition = "AND"
regexTarget = "secret"
regexes = ['''^[A-Z][A-Z0-9_]*=$''']
paths = ['''(^|/)\.env\.example$''']

# Firebase emulator fixtures: the Auth emulator accepts any API key and the
# tests use the literal "fake-api-key"; demo-* project ids never reach a real
# project. Neither is a credential.
[[allowlists]]
description = "Firebase emulator fake API key and demo project ids"
regexTarget = "secret"
regexes = ['''^fake-api-key$''', '''^demo-[a-z0-9-]+$''']



# Audit F30 (re-audit D3): commit 126164c on claude/remediate-f30 (PR #36) passed a
# deliberately weak 15-character store password to the secrets-preflight refusal
# test, which must reject it as too short. It is a fixture, not a credential; the
# branch tip now builds its weak values at runtime. The default full-history scan
# covers every fetched branch, so main needs this entry too. Exact value, that
# one script, generic-api-key only.
[[allowlists]]
description = "F30 D3 weak-password fixture for the secrets-preflight refusal test"
condition = "AND"
regexTarget = "secret"
regexes = ['''^short-pw-15char$''']
paths = ['''^corpus_service/tests/e2e/store_security_e2e\.sh$''']
targetRules = ["generic-api-key"]

# Vitest-only AES-256-GCM fixtures for the F03 document vault tests (64 hex chars, not credentials):
# the deterministic suite key, its upper-case spelling (the key check accepts either case) and a
# second key that must fail to decrypt objects written under the first. Exact values, these test
# files, generic-api-key only. Commit 59b25ea on cursor/remediate-f03-r2-9504 (PR #47) carries the
# last two, and the full-history scan reads every fetched branch, so main needs this entry too.
[[allowlists]]
description = "F03 document object encryption test fixtures (deterministic vitest keys)"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^a1b2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00$''',
  '''^A1B2C3D4E5F60718293A4B5C6D7E8F90112233445566778899AABBCCDDEEFF00$''',
  '''^0f1e2d3c4b5a69788796a5b4c3d2e1f00112233445566778899aabbccddeeff1$''',
]
paths = [
  '''^tests/setup/document-object-store\.ts$''',
  '''^tests/f03-document-object-store\.unit\.test\.ts$''',
  '''^tests/f03-document-bytes\.e2e\.test\.ts$''',
  '''^tests/f03-document-object-s3\.faults\.unit\.test\.ts$''',
  '''^tests/f03-document-object-store\.s3\.integration\.test\.ts$''',
  '''^tests/f03-r2-document-vault\.e2e\.firestore\.test\.ts$''',
]
targetRules = ["generic-api-key"]

# Audit F23 re-audit round 2: commits 155cc9f..935166d on claude/remediate-f23-fu wrote the call
# `_json_headers(key, length=MAX_BODY_BYTES + 1)` in the uvicorn body-guard test; generic-api-key
# reads "key" followed by "length=MAX_BODY_BYTES" as a key and its value. It is a keyword argument
# naming a constant (32 KiB), not a credential, and the branch tip no longer has it. The PR scan
# reads every commit and history is not rewritten, so the entry stays. Exact value, that file,
# generic-api-key only.
[[allowlists]]
description = "F23 round 2: a keyword argument naming the body cap in the uvicorn guard test"
condition = "AND"
regexTarget = "secret"
regexes = ['''^length=MAX_BODY_BYTES$''']
paths = ['''^corpus_service/tests/test_f23_review_body_guard_e2e\.py$''']
targetRules = ["generic-api-key"]
